---
- name: Setup Home Assistant on Raspberry Pi
  hosts: all
  become: yes

  vars_files:
    - vars/main.yml

  pre_tasks:
    - name: Load .env file
      slurp:
        src: "{{ playbook_dir }}/../.env"
      register: env_file
      failed_when: false

    - name: Parse .env variables
      set_fact:
        ha_version: "{{ (env_file.content | b64decode | regex_search('HA_VERSION=(.+)', '\\1') | first) if env_file.stat is defined and env_file.stat.exists else ha_version_default }}"
        ssd_path: "{{ (env_file.content | b64decode | regex_search('SSD_PATH=(.+)', '\\1') | first) if env_file.stat is defined and env_file.stat.exists else ssd_path_default }}"
      vars:
        ha_version_default: "2024.12.0"
        ssd_path_default: "/mnt/ssd"

  roles:
    - homeassistant

  post_tasks:
    - name: Print setup completion info
      debug:
        msg:
          - ""
          - "✓ Home Assistant setup complete!"
          - ""
          - "Access Home Assistant at: http://{{ ansible_host }}:8123"
          - ""
          - "First-run setup:"
          - "  1. Create your admin user"
          - "  2. Add integrations via Settings > Devices & Services"
          - "  3. Create automations via Settings > Automations"
          - ""
          - "Troubleshooting: See docs/troubleshooting.md"
          - ""
