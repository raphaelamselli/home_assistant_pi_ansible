# Ansible Inventory for Home Assistant Setup
# Copy this to inventory.ini and update with your Pi's details

[homeassistant]
# Use either IP address or hostname
# Replace <pi-ip> with your Raspberry Pi's IP address or hostname
# Replace <user> with the SSH user (usually 'pi' for Raspberry Pi OS)

pi_host ansible_host=192.168.1.100 ansible_user=pi

# Alternative: using hostname
# pi_host ansible_host=raspberry-pi.local ansible_user=pi

# Alternative: using a specific SSH key
# pi_host ansible_host=192.168.1.100 ansible_user=pi ansible_ssh_private_key_file=~/.ssh/id_rsa
